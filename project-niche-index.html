# The Niche Index

*React · Node.js · Spotify API — 2024*

Edit the markdown block in `project-niche-index.html` to add more detail,
screenshots, or write-up.

## Overview

The Niche Index calculates an "obscurity score" for a user's music
library by combining track virality and artist popularity. I designed the
scoring model and built the UI to mirror Spotify's design language.
