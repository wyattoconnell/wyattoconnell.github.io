# Amigo

*Garmin Connect IQ · FastAPI · Next.js · Supabase — 2026*

Edit the markdown block in `project-amigo.html` to add more detail,
screenshots, or write-up.

## Overview

Amigo is a Garmin watch face that turns your daily steps, distance, and
active calories into a live leaderboard against your friends. There's no
email/password signup — your identity in the app is a short friend code,
optionally paired with a PIN if you want to also check your stats from the
companion web app. The watch face syncs in the background on its own
schedule, so the leaderboard stays current without you having to open
anything.

## Architecture

Amigo is really three deployables kept in sync: the watch face pushes
device data in the background, a single FastAPI service answers both the
watch and the companion web app, and Supabase holds the shared state
(friend codes, rolling per-day stats, and all-time bests that survive past
the stats retention window). The watch face repo and the server repo are
developed and deployed independently — this is the connective tissue
between them.

Every friend's watch is doing the same two things independently: pushing
its own stats up in the background, and pulling everyone else's stats back
down so the leaderboard on your wrist stays current without opening the
app. The server is the single hub all of those watches sync through.
